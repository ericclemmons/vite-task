[[e2e]]
name = "node_modules_bin_content_ignored"
comment = """
A shim in `node_modules/.bin` whose target is outside its `node_modules` folder is fingerprinted only by whether it exists, so a shim rewritten with the workspace at another path keeps the cache hit. Removing it is a cache miss.
"""
steps = [
  [
    "vtt",
    "mkdir",
    "-p",
    "node_modules/.bin",
  ],
  [
    "vtt",
    "cp",
    "shim.sh",
    "node_modules/.bin/tool",
  ],
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache miss" },
  { argv = [
    "vtt",
    "replace-file-content",
    "node_modules/.bin/tool",
    "/home/alice/project",
    "/home/bob/project",
  ], comment = "reinstall with the workspace at another path" },
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache hit" },
  { argv = [
    "vtt",
    "rm",
    "node_modules/.bin/tool",
  ], comment = "remove the shim" },
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache miss: input removed" },
]

[[e2e]]
name = "node_modules_bin_target_changed"
comment = """
A pnpm shim is fingerprinted by the package file it runs, so upgrading the package is a cache miss, even when the old version's files are still in `node_modules/.pnpm`.
"""
steps = [
  [
    "vtt",
    "mkdir",
    "-p",
    "node_modules/.bin",
  ],
  [
    "vtt",
    "cp",
    "shim-1.0.0.sh",
    "node_modules/.bin/tool",
  ],
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache miss" },
  { argv = [
    "vtt",
    "cp",
    "shim-2.0.0.sh",
    "node_modules/.bin/tool",
  ], comment = "upgrade the package, which rewrites the shim" },
  { argv = [
    "vt",
    "run",
    "read-shim",
  ], comment = "cache miss: shim target changed" },
]
